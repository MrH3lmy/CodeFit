name: Desktop Gate 0

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    # Ubuntu 22.04 supports the unprivileged Chromium sandbox without a host AppArmor override.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run build && npm run prepare:java && npm test && npm run package
        working-directory: desktop
      - name: Smoke test packaged desktop with sandbox enabled
        working-directory: desktop
        run: CODEFIT_DESKTOP_EXECUTABLE="$PWD/release/CodeFit-Gate0-linux-x64/codefit-gate0" xvfb-run -a -s "-screen 0 2560x1800x24" npm run test:e2e
      - name: Archive unsigned Linux proof (preserve executable permissions)
        run: tar -czf codefit-gate0-linux-x64.tar.gz -C desktop/release CodeFit-Gate0-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: codefit-gate0-linux-x64-unsigned
          path: codefit-gate0-linux-x64.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-failure-traces
          path: desktop/test-results/
