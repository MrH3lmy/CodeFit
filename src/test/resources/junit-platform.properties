# Enforced sequential test execution policy (#175).
#
# DatabaseConfig.databaseUrl is process-wide static state: every repository/service integration test
# in this suite redirects it to its own isolated SQLite file for the duration of its test class (see
# com.codefit.testsupport.IsolatedDatabaseExtension) and restores the shared default afterward. That
# redirect is only safe if no two test classes ever run their @BeforeAll/@AfterAll at the same time -
# concurrent classes could otherwise interleave their useDatabaseFile()/useDefaultDatabaseFile() calls
# and point each other's repositories at the wrong file mid-test.
#
# junit.jupiter.execution.parallel.enabled already defaults to false, so this file changes no current
# behavior; it exists so that policy is explicit and version-controlled rather than an unstated
# assumption. Every IsolatedDatabaseExtension-annotated test class additionally declares
# @ResourceLock(IsolatedDatabaseExtension.DATABASE_RESOURCE) as a second, independent safeguard: if
# parallel execution is ever enabled here in the future, JUnit's own scheduler will serialize those
# classes against each other rather than relying on this file alone.
junit.jupiter.execution.parallel.enabled=false
